    <!-- EXPENSE LOG (VISUAL RECENT ITEMS) -->

        <button onclick="clearHistory()" class="text-xs font-bold text-slate-400 hover:text-rose-500">Clear All</button>

  <!-- Audio Sound Synthesizer via Web Audio API -->
  <script>
    // Audio Context for Kid Sound Effects
    let audioCtx = null;

    function playKidSound(type) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'coin') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(987.77, now); // B5
          osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, now + idx * 0.08);
            g.gain.setValueAtTime(0.2, now + idx * 0.08);
            g.gain.linearRampToValueAtTime(0, now + idx * 0.08 + 0.2);
            o.start(now + idx * 0.08);
            o.stop(now + idx * 0.08 + 0.2);
          });
        }
      } catch (e) {
        // Audio fallback silent
      }
    }

    // STATE
    const PEOPLE = [
      { id: 'p1', name: 'Judy', emoji: '🐶', color: 'pink' },
      { id: 'p2', name: 'Kelly', emoji: '🐱', color: 'purple' },
      { id: 'p3', name: 'Andy', emoji: '🦊', color: 'amber' }
    ];

    let currentPayer = 'p1';
    let currentItem = 'Pizza 🍕';
    let currentAmount = 0;
    let sharers = { 'p1': true, 'p2': true, 'p3': true };
    let expenses = [];

    // INIT
    window.onload = function() {
      loadStorage();
      if (expenses.length === 0) {
        // Starter kid friendly expenses
        expenses = [
          { id: '1', title: 'Ice Cream 🍦', payerId: 'p1', amount: 12, sharers: ['p1', 'p2', 'p3'] },
          { id: '2', title: 'Toys 🧸', payerId: 'p3', amount: 15, sharers: ['p1', 'p2', 'p3'] }
        ];
        saveStorage();
      }
      selectPayer('p1', false);
      selectItem('Pizza 🍕', false);
      updateApp();
    };

    function saveStorage() {
      localStorage.setItem('piggy_split_kids_data', JSON.stringify(expenses));
    }

    function loadStorage() {
      const data = localStorage.getItem('piggy_split_kids_data');
      if (data) {
        try { expenses = JSON.parse(data); } catch(e){}
      }
    }

    // UI CONTROLS
    function selectPayer(id, sound = true) {
      if (sound) playKidSound('pop');
      currentPayer = id;

      PEOPLE.forEach(p => {
        const btn = document.getElementById(`payer-${p.id}`);
        const check = btn.querySelector('.check-icon');
        if (p.id === id) {
          btn.classList.add('ring-4', 'ring-pink-400', 'scale-105');
          check.classList.remove('hidden');
        } else {
          btn.classList.remove('ring-4', 'ring-pink-400', 'scale-105');
          check.classList.add('hidden');
        }
      });
    }

    function selectItem(itemName, sound = true) {
      if (sound) playKidSound('pop');
      currentItem = itemName;

      const buttons = document.querySelectorAll('.item-btn');
      buttons.forEach(btn => {
        if (btn.innerText.includes(itemName.split(' ')[0])) {
          btn.classList.add('border-purple-500', 'bg-purple-100', 'scale-105');
        } else {
          btn.classList.remove('border-purple-500', 'bg-purple-100', 'scale-105');
        }
      });
    }

    function addPresetAmount(num) {
      playKidSound('coin');
      currentAmount += num;
      document.getElementById('amount-display').innerText = currentAmount;
    }

    function clearAmount() {
      playKidSound('pop');
      currentAmount = 0;
      document.getElementById('amount-display').innerText = '0';
    }

    function toggleSharer(id) {
      playKidSound('pop');
      sharers[id] = !sharers[id];

      const card = document.getElementById(`sharer-${id}`);
      const badge = card.querySelector('.status-badge');

      if (sharers[id]) {
        card.classList.remove('opacity-40', 'border-slate-300', 'bg-slate-100');
        card.classList.add('border-emerald-400', 'bg-emerald-50');
        badge.innerText = 'Included';
        badge.className = 'status-badge text-[10px] font-black uppercase text-emerald-600 bg-emerald-200 px-2 py-0.5 rounded-full mt-1';
      } else {
        card.classList.add('opacity-40', 'border-slate-300', 'bg-slate-100');
        card.classList.remove('border-emerald-400', 'bg-emerald-50');
        badge.innerText = 'Skipped';
        badge.className = 'status-badge text-[10px] font-black uppercase text-slate-500 bg-slate-200 px-2 py-0.5 rounded-full mt-1';
      }
    }

    // ADD EXPENSE
    function addExpense() {
      if (currentAmount <= 0) {
        alert("Please add some coins first! 🪙");
        return;
      }

      const activeSharers = Object.keys(sharers).filter(k => sharers[k]);
      if (activeSharers.length === 0) {
        alert("Please pick at least one person who shared! 🤝");
        return;
      }

      const newExp = {
        id: Date.now().toString(),
        title: currentItem,
        payerId: currentPayer,
        amount: currentAmount,
        sharers: activeSharers
      };

      expenses.unshift(newExp);
      saveStorage();

      playKidSound('fanfare');
      confetti({
        particleCount: 50,
        spread: 60,
        origin: { y: 0.7 }
      });

      // Reset
      currentAmount = 0;
      document.getElementById('amount-display').innerText = '0';

      updateApp();
    }

    // SETTLEMENT CALCULATOR
    function updateApp() {
      renderSettlement();
      renderHistory();
    }

    function renderSettlement() {
      const balances = { 'p1': 0, 'p2': 0, 'p3': 0 };

      expenses.forEach(exp => {
        const amt = exp.amount;
        // Payer gains credit
        balances[exp.payerId] += amt;

        // Sharers owe equal slice
        const share = amt / exp.sharers.length;
        exp.sharers.forEach(sId => {
          balances[sId] -= share;
        });
      });

      // Min cash flow settlement
      const debtors = [];
      const creditors = [];

      Object.keys(balances).forEach(id => {
        const b = Math.round(balances[id] * 100) / 100;
        if (b < -0.01) debtors.push({ id, amount: -b });
        if (b > 0.01) creditors.push({ id, amount: b });
      });

      const transactions = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        const d = debtors[i];
        const c = creditors[j];
        const min = Math.min(d.amount, c.amount);

        transactions.push({
          from: d.id,
          to: c.id,
          amount: Math.round(min)
        });

        d.amount -= min;
        c.amount -= min;

        if (d.amount <= 0.01) i++;
        if (c.amount <= 0.01) j++;
      }

      const container = document.getElementById('settlement-cards');
      container.innerHTML = '';

      if (transactions.length === 0) {
        container.innerHTML = `
          <div class="bg-white/10 rounded-2xl p-4 text-center border-2 border-white/20">
            <span class="text-4xl block mb-1">🎉</span>
            <p class="font-bold text-lg">Everyone is all square!</p>
            <p class="text-xs text-purple-200">No coins owed to anyone!</p>
          </div>
        `;
        return;
      }

      transactions.forEach(t => {
        const fromP = PEOPLE.find(p => p.id === t.from);
        const toP = PEOPLE.find(p => p.id === t.to);

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-3 text-slate-800 flex items-center justify-between border-2 border-yellow-300 kid-shadow-sm";
        card.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="text-3xl">${fromP.emoji}</span>
            <div>
              <p class="font-extrabold text-sm">${fromP.name}</p>
              <p class="text-[10px] font-bold text-slate-400 uppercase">Gives</p>
            </div>
          </div>

          <div class="flex flex-col items-center">
            <span class="text-lg font-black text-emerald-600 bg-emerald-100 px-3 py-0.5 rounded-full">
              $${t.amount} 🪙
            </span>
            <span class="text-xs text-slate-400 mt-0.5">➡️</span>
          </div>

          <div class="flex items-center space-x-2">
            <div class="text-right">
              <p class="font-extrabold text-sm">${toP.name}</p>
              <p class="text-[10px] font-bold text-slate-400 uppercase">Gets</p>
            </div>
            <span class="text-3xl">${toP.emoji}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';

      if (expenses.length === 0) {
        container.innerHTML = `
          <p class="text-center text-xs text-slate-400 py-4 font-bold">Piggy Bank is empty! 🐷</p>
        `;
        return;
      }

      expenses.forEach(exp => {
        const payer = PEOPLE.find(p => p.id === exp.payerId);
        const card = document.createElement('div');
        card.className = "p-3 bg-slate-50 rounded-2xl border-2 border-slate-200 flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-3xl">${payer.emoji}</span>
            <div>
              <p class="font-extrabold text-sm text-slate-700">${exp.title}</p>
              <p class="text-xs text-slate-400 font-bold">Paid by ${payer.name}</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <span class="font-black text-emerald-600 text-lg">$${exp.amount}</span>
            <button onclick="deleteExpense('${exp.id}')" class="text-slate-300 hover:text-rose-500 p-1 text-sm">
              <i class="fa-solid fa-circle-xmark"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function deleteExpense(id) {
      playKidSound('pop');
      expenses = expenses.filter(x => x.id !== id);
      saveStorage();
      updateApp();
    }

    function clearHistory() {
      if (confirm('Reset piggy bank history?')) {
        playKidSound('pop');
        expenses = [];
        saveStorage();
        updateApp();
      }
    }

    function settleAll() {
      playKidSound('fanfare');
      confetti({
        particleCount: 120,
        spread: 100,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        if (confirm('Yay! Celebrate settlement! Clear all current history?')) {
          expenses = [];
          saveStorage();
          updateApp();
        }
      }, 500);
    }
  </script>
</body>
</html>
